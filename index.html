<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <style>
    :root {
      --bg: #ededed;
      --header: #ededed;
      --me: #95ec69;
      --her: #ffffff;
      --line: #d8d8d8;
      --ink: #111;
      --sub: #888;
      --accent: #07c160;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      background: #c8c8c8;
      color: var(--ink);
    }
    .phone {
      max-width: 430px;
      height: 100%;
      margin: 0 auto;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 50px rgba(0,0,0,.18);
    }
    header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: calc(12px + env(safe-area-inset-top)) 12px 10px;
      background: var(--header);
      border-bottom: 1px solid var(--line);
    }
    .back { width: 22px; opacity: .35; font-size: 22px; line-height: 1; }
    .avatar, .mini { position: relative; overflow: hidden; }
    .avatar {
      width: 40px; height: 40px; border-radius: 6px;
      background: #fff; color: #111; display: grid; place-items: center;
      font-weight: 600; font-size: 15px; flex: 0 0 40px;
    }
    .avatar img, .mini img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; object-position: center;
    }
    .who { flex: 1; min-width: 0; }
    .who b { display: block; font-size: 16px; }
    .who span { font-size: 11px; color: var(--sub); }
    .gear {
      border: 0; background: transparent; font-size: 20px; padding: 6px; cursor: pointer; color: #555;
    }
    #log { flex: 1; overflow-y: auto; padding: 14px 12px 8px; }
    .day { text-align: center; color: var(--sub); font-size: 12px; margin: 10px 0 14px; }
    .row { display: flex; gap: 8px; margin: 0 0 12px; align-items: flex-start; }
    .row.me { flex-direction: row-reverse; }
    .bubble {
      max-width: 74%;
      padding: 9px 11px;
      border-radius: 6px;
      font-size: 16px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 1px 1px rgba(0,0,0,.04);
    }
    .row.her .bubble { background: var(--her); }
    .row.me .bubble { background: var(--me); }
    .bubble img.sticker {
      display: block;
      width: 128px;
      height: 128px;
      object-fit: contain;
      margin: 2px 0;
    }
    .bubble.sticker-only {
      background: transparent;
      box-shadow: none;
      padding: 0;
    }
    .mini {
      width: 32px; height: 32px; border-radius: 4px; flex: 0 0 32px;
      display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 600;
    }
    .row.her .mini { background: #fff; }
    .row.me .mini { background: #7bb3f0; }
    .hint { color: var(--sub); font-size: 12px; text-align: center; padding: 8px 16px 16px; }
    footer {
      flex: 0 0 auto;
      display: flex; gap: 8px; align-items: flex-end;
      padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
      background: #f7f7f7;
      border-top: 1px solid var(--line);
    }
    textarea {
      flex: 1; resize: none; border: 0; border-radius: 6px;
      min-height: 40px; max-height: 120px; padding: 10px 12px;
      font: inherit; font-size: 16px; outline: none; background: #fff;
    }
    button.send {
      height: 40px; padding: 0 14px; border: 0; border-radius: 6px;
      background: var(--accent); color: #fff; font-size: 15px; cursor: pointer;
    }
    button.send:disabled { opacity: .45; cursor: default; }
    dialog {
      border: 0; border-radius: 12px; width: min(400px, calc(100vw - 32px));
      padding: 18px 16px 14px; box-shadow: 0 12px 40px rgba(0,0,0,.2);
    }
    dialog::backdrop { background: rgba(0,0,0,.35); }
    dialog h2 { margin: 0 0 12px; font-size: 17px; }
    label { display: block; font-size: 12px; color: var(--sub); margin: 10px 0 4px; }
    input, select {
      width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font: inherit;
    }
    .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .actions button {
      border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; font: inherit;
    }
    .ghost { background: #f0f0f0; }
    .ok { background: var(--accent); color: #fff; }
    .status { font-size: 12px; color: var(--sub); margin-top: 8px; line-height: 1.5; }
  </style>
</head>

    const FALLBACK_PACK = {
      name: "汪宇涵",
      persona: "",
      examples: [],
      memories: [],
      stats: {},
      rules: "你就是汪宇涵。微信名喜之郎。像微信短句，不要自称 AI，不要用客服腔。",
    };

    function readPack() {
      try {
        const raw = document.getElementById("wyh-pack").textContent || "{}";
        const pack = JSON.parse(raw);
        return pack && pack.name ? pack : FALLBACK_PACK;
      } catch (e) {
        return FALLBACK_PACK;
      }
    }

    const DEFAULT_PACK = readPack();
    const $ = (id) => document.getElementById(id);
    const state = { pack: DEFAULT_PACK, history: [], busy: false };

    function apiKey() {
      return (localStorage.getItem("wyh_key") || "").trim();
    }

    function avatarSrc() {
      return AVATAR_DATA_URI || "";
    }

    function faceEl(role) {
      const face = document.createElement("div");
      face.className = "mini";
      face.textContent = role === "me" ? "我" : "涵";
      if (role === "her" && avatarSrc()) {
        const img = document.createElement("img");
        img.src = avatarSrc();
        img.alt = "汪宇涵";
        face.appendChild(img);
      }
      return face;
    }

    function setHeaderAvatar() {
      const box = $("headAvatar");
      box.querySelectorAll("img").forEach((n) => n.remove());
      if (!avatarSrc()) return;
      const img = document.createElement("img");
      img.src = avatarSrc();
      img.alt = "汪宇涵";
      box.appendChild(img);
    }

    function stickerById(id) {
      const list = (state.pack && state.pack.stickers) || [];
      return list.find((s) => s.id === id);
    }

    function fillBubble(el, text) {
      el.replaceChildren();
      el.classList.remove("sticker-only");
      const re = /\[\[sticker:([a-zA-Z0-9_-]+)\]\]/g;
      let last = 0;
      let m;
      let stickers = 0;
      let chars = 0;
      const addText = (raw) => {
        const t = raw.replace(/\n+/g, "").trim();
        if (!t) return;
        const span = document.createElement("span");
        span.textContent = t;
        el.appendChild(span);
        chars += t.length;
      };
      while ((m = re.exec(text))) {
        addText(text.slice(last, m.index));
        const st = stickerById(m[1]);
        if (st && st.src) {
          const img = document.createElement("img");
          img.className = "sticker";
          img.src = st.src;
          img.alt = st.name || st.id;
          el.appendChild(img);
          stickers += 1;
        }
        last = m.index + m[0].length;
      }
      addText(text.slice(last));
      if (stickers && !chars) el.classList.add("sticker-only");
    }

    function bubble(role, text) {
      const row = document.createElement("div");
      row.className = "row " + role;
      const b = document.createElement("div");
      b.className = "bubble";
      fillBubble(b, text);
      row.append(faceEl(role), b);
      $("log").appendChild(row);
      $("log").scrollTop = $("log").scrollHeight;
      return b;
    }

    function scoreText(query, text) {
      const q = Array.from(query).filter((c) => c > "\u4e00" && c < "\u9fff");
      let s = 0;
      for (let i = 0; i < q.length - 1; i++) {
        if (text.includes(q[i] + q[i + 1])) s += 1;
      }
      return s;
    }

    function retrievePairs(query) {
      const pairs = (state.pack && state.pack.pairs) || [];
      const scored = pairs
        .map((p) => ({ s: scoreText(query, (p.cue || "") + (p.reply || "")), p }))
        .filter((x) => x.s > 0)
        .sort((a, b) => b.s - a.s)
        .slice(0, 6)
        .map((x) => x.p);
      const fallback = pairs.filter((p) => p.cue && p.reply).slice(0, 4);
      const seen = new Set();
      const out = [];
      for (const p of scored.concat(fallback)) {
        const k = p.cue + "||" + p.reply;
        if (seen.has(k)) continue;
        seen.add(k);
        out.push(p);
        if (out.length >= 8) break;
      }
      return out;
    }

    function formatPair(p) {
      const cue = (p.cue || "").split("\n").filter(Boolean).map((l) => "你：" + l).join("\n");
      const reply = (p.reply || "").split("\n").filter(Boolean).map((l) => "她：" + l).join("\n");
      return (cue ? cue + "\n" : "") + reply;
    }

    function stickerGuide() {
      const list = (state.pack && state.pack.stickers) || [];
      if (!list.length) return "";
      const lines = list.map((s) => {
        const when = s.when ? "，" + s.when : "";
        return "- [[sticker:" + s.id + "]] " + (s.name || s.id) + when;
      });
      return [
        "她会发微信表情包。觉得该发表情时，单独写一行 [[sticker:id]]，不要用文字形容表情。",
        "一次最多一张。不要连续刷。现有表情：",
        ...lines,
      ].join("\n");
    }

    function systemPrompt(userText) {
      const pack = state.pack || DEFAULT_PACK;
      const pairs = retrievePairs(userText).map(formatPair).join("\n\n");
      return [
        "你就是汪宇涵，微信名喜之郎，正在跟对方微信聊天。",
        "只学她怎么接话，不要复读整段记录。",
        "标点和语气跟她一样：什么？！为啥啊 哦哦 我去 不是！ 哇塞 我靠了",
        "一次可以回好几句，全部连着写，不要换行，不要空行。",
        "不要解释，不要列点，不要问需要帮忙吗，不要自称 AI。",
        "没在记录里见过的私事，含糊带过或反问，不要编。",
        stickerGuide(),
        pack.rules || "",
        pack.persona || "",
        pairs ? "\n对照她平时怎么接（学口气，不要原文复读）：\n" + pairs : "",
      ].join("\n");
    }

    function applyPack(pack) {
      state.pack = pack || DEFAULT_PACK;
      const n = (state.pack.stats && state.pack.stats.her) || (state.pack.examples || []).length || 0;
      $("hint").textContent = n
        ? "已写入喜之郎语料 · " + n + " 条。点右上角 ⋯ 填 Key 就能聊。"
        : "第一次用：点右上角 ⋯ 填 DeepSeek Key。聊天记录发给我，不用在网页里导入。";
      $("sub").textContent = apiKey() ? "在线" : "先填 Key";
    }

    async function ask() {
      const text = $("box").value.trim();
      if (!text || state.busy) return;
      if (!apiKey()) {
        $("stat").textContent = "先填 DeepSeek Key。只存在这台浏览器。";
        $("dlg").showModal();
        return;
      }
      $("box").value = "";
      bubble("me", text);
      state.history.push({ role: "user", content: text });
      const her = bubble("her", "");
      state.busy = true;
      $("send").disabled = true;
      try {
        const r = await fetch("https://api.deepseek.com/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + apiKey(),
          },
          body: JSON.stringify({
            model: localStorage.getItem("wyh_model") || "deepseek-chat",
            temperature: 0.85,
            stream: true,
            messages: [
              { role: "system", content: systemPrompt(text) },
              ...state.history.slice(-16),
            ],
          }),
        });
        if (!r.ok) {
          her.textContent = "没发出去：" + (await r.text()).slice(0, 180);
          return;
        }
        const reader = r.body.getReader();
        const dec = new TextDecoder();
        let acc = "";
        let buf = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const parts = buf.split("\n");
          buf = parts.pop() || "";
          for (const line of parts) {
            const s = line.trim();
            if (!s.startsWith("data:")) continue;
            const data = s.slice(5).trim();
            if (data === "[DONE]") continue;
            try {
              const j = JSON.parse(data);
              const delta = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
              if (delta) {
                acc += delta;
                fillBubble(her, acc);
                $("log").scrollTop = $("log").scrollHeight;
              }
            } catch {}
          }
        }
        if (!acc) fillBubble(her, "……");
        else fillBubble(her, acc);
        state.history.push({ role: "assistant", content: acc || "……" });
      } catch (e) {
        her.textContent = "浏览器没连上 DeepSeek。检查网络，或换 Chrome 再开这个 HTML。";
      } finally {
        state.busy = false;
        $("send").disabled = false;
        $("box").focus();
      }
    }

    $("send").onclick = ask;
    $("box").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        ask();
      }
    });
    $("openSet").onclick = () => {
      $("key").value = apiKey();
      $("model").value = localStorage.getItem("wyh_model") || "deepseek-chat";
      $("dlg").showModal();
    };
    $("save").onclick = () => {
      localStorage.setItem("wyh_key", $("key").value.trim());
      localStorage.setItem("wyh_model", $("model").value);
      $("sub").textContent = apiKey() ? "在线" : "先填 Key";
      $("dlg").close();
    };
    $("clear").onclick = () => {
      state.history = [];
      $("log").innerHTML = '<div class="day">今天</div>';
    };

    setHeaderAvatar();
    applyPack(DEFAULT_PACK);
    bubble("her", "在吗");
    if (!apiKey()) $("dlg").showModal();
  </script>
</body>
