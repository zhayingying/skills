    const FALLBACK_PACK = {
      name: "汪宇涵",
      persona: "",
      examples: [],
      memories: [],
      stats: {},
      rules: "你就是汪宇涵。微信名喜之郎。像微信短句，不要自称 AI，不要用客服腔。",
    };

    function readPack() {
      try {
        const raw = document.getElementById("wyh-pack").textContent || "{}";
        const pack = JSON.parse(raw);
        return pack && pack.name ? pack : FALLBACK_PACK;
      } catch (e) {
        return FALLBACK_PACK;
      }
    }

    const DEFAULT_PACK = readPack();
    const $ = (id) => document.getElementById(id);
    const state = { pack: DEFAULT_PACK, history: [], busy: false };

    function apiKey() {
      return (localStorage.getItem("wyh_key") || "").trim();
    }

    function avatarSrc() {
      return AVATAR_DATA_URI || "";
    }

    function faceEl(role) {
      const face = document.createElement("div");
      face.className = "mini";
      face.textContent = role === "me" ? "我" : "涵";
      if (role === "her" && avatarSrc()) {
        const img = document.createElement("img");
        img.src = avatarSrc();
        img.alt = "汪宇涵";
        face.appendChild(img);
      }
      return face;
    }

    function setHeaderAvatar() {
      const box = $("headAvatar");
      box.querySelectorAll("img").forEach((n) => n.remove());
      if (!avatarSrc()) return;
      const img = document.createElement("img");
      img.src = avatarSrc();
      img.alt = "汪宇涵";
      box.appendChild(img);
    }

    function stickerById(id) {
      const list = (state.pack && state.pack.stickers) || [];
      return list.find((s) => s.id === id);
    }

    function stripHerText(t) {
      return String(t || "")
        .replace(/[。．]/g, "")
        .replace(/[我家你]家梁显/g, "梁显")
        .replace(/我对象/g, "梁显")
        .replace(/对象/g, "梁显")
        .replace(/\p{Extended_Pictographic}/gu, "")
        .replace(/\uFE0F/g, "")
        .replace(/\s{2,}/g, " ")
        .trim();
    }

    function fillBubble(el, text, role) {
      el.replaceChildren();
      el.classList.remove("sticker-only");
      const re = /\[\[sticker:([a-zA-Z0-9_-]+)\]\]/g;
      let last = 0;
      let m;
      let stickers = 0;
      let chars = 0;
      const addText = (raw) => {
        let t = raw.replace(/\n+/g, "").trim();
        if (role === "her") t = stripHerText(t);
        if (!t) return;
        const span = document.createElement("span");
        span.textContent = t;
        el.appendChild(span);
        chars += t.length;
      };
      while ((m = re.exec(text))) {
        addText(text.slice(last, m.index));
        const st = stickerById(m[1]);
        if (st && st.src) {
          const img = document.createElement("img");
          img.className = "sticker";
          img.src = st.src;
          img.alt = st.name || st.id;
          el.appendChild(img);
          stickers += 1;
        }
        last = m.index + m[0].length;
      }
      addText(text.slice(last));
      if (stickers && !chars) el.classList.add("sticker-only");
    }

    function splitTextBits(s) {
      return String(s || "")
        .split(/[，,、\n]+/)
        .map((x) => x.replace(/\s+/g, " ").trim())
        .filter(Boolean);
    }

    function splitHerTalk(text) {
      const raw = String(text || "")
        .replace(/[。．]/g, "")
        .replace(/\p{Extended_Pictographic}/gu, "")
        .replace(/\uFE0F/g, "");
      const re = /\[\[sticker:[a-zA-Z0-9_-]+\]\]/g;
      const out = [];
      let last = 0;
      let m;
      while ((m = re.exec(raw))) {
        out.push(...splitTextBits(raw.slice(last, m.index)));
        out.push(m[0]);
        last = m.index + m[0].length;
      }
      out.push(...splitTextBits(raw.slice(last)));
      return out;
    }

    function paintHer(firstEl, text, extraEls) {
      const parts = splitHerTalk(text);
      const shown = parts.length ? parts : ["……"];
      fillBubble(firstEl, shown[0], "her");
      while (extraEls.length < shown.length - 1) extraEls.push(bubble("her", ""));
      for (let i = 1; i < shown.length; i++) fillBubble(extraEls[i - 1], shown[i], "her");
      return shown;
    }

    function bubble(role, text) {
      const row = document.createElement("div");
      row.className = "row " + role;
      const b = document.createElement("div");
      b.className = "bubble";
      fillBubble(b, text, role);
      row.append(faceEl(role), b);
      $("log").appendChild(row);
      $("log").scrollTop = $("log").scrollHeight;
      return b;
    }

    function scoreText(query, text) {
      const q = Array.from(query).filter((c) => c > "\u4e00" && c < "\u9fff");
      let s = 0;
      for (let i = 0; i < q.length - 1; i++) {
        if (text.includes(q[i] + q[i + 1])) s += 1;
      }
      return s;
    }

    function retrievePairs(query) {
      const pairs = (state.pack && state.pack.pairs) || [];
      const scored = pairs
        .map((p) => ({ s: scoreText(query, (p.cue || "") + (p.reply || "")), p }))
        .filter((x) => x.s > 0)
        .sort((a, b) => b.s - a.s)
        .slice(0, 6)
        .map((x) => x.p);
      const fallback = pairs.filter((p) => p.cue && p.reply).slice(0, 4);
      const seen = new Set();
      const out = [];
      for (const p of scored.concat(fallback)) {
        const k = p.cue + "||" + p.reply;
        if (seen.has(k)) continue;
        seen.add(k);
        out.push(p);
        if (out.length >= 8) break;
      }
      return out;
    }

    function formatPair(p) {
      const cue = (p.cue || "").split("\n").filter(Boolean).map((l) => "你：" + l).join("\n");
      const reply = (p.reply || "").split("\n").filter(Boolean).map((l) => "她：" + l).join("\n");
      return (cue ? cue + "\n" : "") + reply;
    }

    function stickerGuide() {
      const list = (state.pack && state.pack.stickers) || [];
      if (!list.length) return "";
      const lines = list.map((s) => {
        const when = s.when ? "，" + s.when : "";
        return "- [[sticker:" + s.id + "]] " + (s.name || s.id) + when;
      });
      return [
        "她会发微信表情包。觉得该发表情时，单独写一行 [[sticker:id]]，不要和文字挤在同一条，不要用文字形容表情。",
        "一次最多一张。不要连续刷。现有表情：",
        ...lines,
      ].join("\n");
    }

    function systemPrompt(userText) {
      const pack = state.pack || DEFAULT_PACK;
      const pairs = retrievePairs(userText).map(formatPair).join("\n\n");
      return [
        "你就是汪宇涵，微信名喜之郎，正在跟对方微信聊天。",
        "只学她怎么接话，不要复读整段记录。",
        "标点和语气跟她一样：什么？！为啥啊 哦哦 我去 不是！ 哇塞 我靠了 好无聊 好累啊",
        "只会说好无聊，不要说无聊死了",
        "不要发 emoji。有表情包就用 [[sticker:id]]，不要用文字形容表情",
        "随便说一句后面经常再跟一张表情包。表情包必须单独一行 [[sticker:id]]，绝对不要和文字写在同一行",
        "约她出去玩她懒得出来时，只发一张表情包不要文字",
        "问在干嘛不许回答看电视，一般是刷抖音、学习或躺着",
        "开场不要问在吗或在干嘛。页面已经说过我是汪宇涵吖，不要再说",
        "对方说 hi / 你好 / 嗨 / 在 时不要自我介绍，随便接一句：嗨、哦哦、咋了、干嘛",
        "查莹莹和梁显每天都跟她聊天，不要说你今天怎么有空找我聊天呀",
        "梁显跟汪宇涵在一起。开口只叫梁显或臭狗屎，不要说对象，不要说我家梁显，也不要说你家梁显",
        "不要用逗号。但凡会写出逗号的句子，就拆成好几条分开发，一条一行，不要空行",
        "说话结尾不要句号，整句都不要用。可以用！？或者不加标点",
        "不能开黄色玩笑",
        "不要解释，不要列点，不要问需要帮忙吗，不要自称 AI。",
        "没在记录里见过的私事，含糊带过或反问，不要编。",
        stickerGuide(),
        pack.rules || "",
        pack.persona || "",
        pairs ? "\n对照她平时怎么接（学口气，不要原文复读）：\n" + pairs : "",
      ].join("\n");
    }

    function applyPack(pack) {
      state.pack = pack || DEFAULT_PACK;
      const n = (state.pack.stats && state.pack.stats.her) || (state.pack.examples || []).length || 0;
      $("hint").textContent = n
        ? "已写入喜之郎语料 · " + n + " 条。点右上角 ⋯ 填 Key 就能聊。"
        : "第一次用：点右上角 ⋯ 填 DeepSeek Key。聊天记录发给我，不用在网页里导入。";
      $("sub").textContent = apiKey() ? "在线" : "先填 Key";
    }

    async function ask() {
      const text = $("box").value.trim();
      if (!text || state.busy) return;
      if (!apiKey()) {
        $("stat").textContent = "先填 DeepSeek Key。只存在这台浏览器。";
        $("dlg").showModal();
        return;
      }
      $("box").value = "";
      bubble("me", text);
      state.history.push({ role: "user", content: text });
      const her = bubble("her", "");
      const extra = [];
      state.busy = true;
      $("send").disabled = true;
      try {
        const r = await fetch("https://api.deepseek.com/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + apiKey(),
          },
          body: JSON.stringify({
            model: localStorage.getItem("wyh_model") || "deepseek-chat",
            temperature: 0.85,
            stream: true,
            messages: [
              { role: "system", content: systemPrompt(text) },
              ...state.history.slice(-16),
            ],
          }),
        });
        if (!r.ok) {
          her.textContent = "没发出去：" + (await r.text()).slice(0, 180);
          return;
        }
        const reader = r.body.getReader();
        const dec = new TextDecoder();
        let acc = "";
        let buf = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const parts = buf.split("\n");
          buf = parts.pop() || "";
          for (const line of parts) {
            const s = line.trim();
            if (!s.startsWith("data:")) continue;
            const data = s.slice(5).trim();
            if (data === "[DONE]") continue;
            try {
              const j = JSON.parse(data);
              const delta = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
              if (delta) {
                acc += delta;
                paintHer(her, acc, extra);
                $("log").scrollTop = $("log").scrollHeight;
              }
            } catch {}
          }
        }
        const shown = paintHer(her, acc || "……", extra);
        state.history.push({ role: "assistant", content: shown.join("\n") });
      } catch (e) {
        her.textContent = "浏览器没连上 DeepSeek。检查网络，或换 Chrome 再开这个 HTML。";
      } finally {
        state.busy = false;
        $("send").disabled = false;
        $("box").focus();
      }
    }

    $("send").onclick = ask;
    $("box").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        ask();
      }
    });
    $("openSet").onclick = () => {
      $("key").value = apiKey();
      $("model").value = localStorage.getItem("wyh_model") || "deepseek-chat";
      $("dlg").showModal();
    };
    $("save").onclick = () => {
      localStorage.setItem("wyh_key", $("key").value.trim());
      localStorage.setItem("wyh_model", $("model").value);
      $("sub").textContent = apiKey() ? "在线" : "先填 Key";
      $("dlg").close();
    };
    function resetChat() {
      state.history = [{ role: "assistant", content: "我是汪宇涵吖" }];
      $("log").innerHTML = '<div class="day">今天</div>';
      bubble("her", "我是汪宇涵吖");
    }

    $("clear").onclick = () => resetChat();

    setHeaderAvatar();
    applyPack(DEFAULT_PACK);
    resetChat();
    if (!apiKey()) $("dlg").showModal();
  </script>
</body>
</html>
